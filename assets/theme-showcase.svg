        <tspan fill="#BFA5D9" font-weight="bold"> DevaPath</tspan>
        <tspan fill="#B3A7C2">: </tspan>
        <tspan fill="#89DCEB">React.FC</tspan>
        <tspan fill="#B3A7C2"> = () =&gt; {</tspan>
      </text>

